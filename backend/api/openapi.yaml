openapi: 3.0.0
info:
  title: Information Exchange Service
  description: API для обмена информацией об угрозах.
  version: 1.0.0

paths:
  /info/{md5}:
    get:
      summary: Получить информацию об угрозе по MD5
      description: Возвращает полную информацию об угрозе для указанного MD5-хеша.
      operationId: getInfoByMd5
      parameters:
        - name: md5
          in: path
          required: true
          description: MD5-хеш файла (32 символа, шестнадцатеричные цифры)
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{32}$'
            example: "d41d8cd98f00b204e9800998ecf8427e"
      responses:
        '200':
          description: Успешный ответ с информацией об угрозе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
        '400':
          description: Некорректный формат MD5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Угроза с указанным MD5 не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Превышен rate limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Таймаут запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Обновить информацию об угрозе по MD5
      description: |
        Частичное обновление существующей угрозы.
        name обязателен. Поля severity/description/category, если не переданы, сохраняют прежние значения.
        Пустые severity/category (если переданы) сбрасываются на medium/other.
      operationId: updateThreat
      parameters:
        - name: md5
          in: path
          required: true
          description: MD5-хеш обновляемой записи
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{32}$'
            example: "d41d8cd98f00b204e9800998ecf8427e"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatUpdateRequest'
      responses:
        '200':
          description: Информация успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
        '400':
          description: Некорректные данные запроса или MD5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Угроза с указанным MD5 не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Метод не поддерживается
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Превышен rate limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Таймаут запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /info:
    post:
      summary: Создать новую запись об угрозе
      description: |
        Добавляет новую информацию об угрозе. MD5 должен быть уникальным.
        Пустые severity/category получают значения по умолчанию medium/other.
        Строковые поля обрезаются по краям; пустой name после trim отклоняется.
      operationId: createThreat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatCreateRequest'
      responses:
        '201':
          description: Запись успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
        '400':
          description: Некорректные данные запроса (например, невалидный MD5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Метод не поддерживается
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Угроза с таким MD5 уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Превышен rate limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Таймаут запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ThreatCreateRequest:
      type: object
      required:
        - md5
        - name
      properties:
        md5:
          type: string
          pattern: '^[a-fA-F0-9]{32}$'
          description: MD5-хеш файла (32 шестнадцатеричных символа)
          example: "d41d8cd98f00b204e9800998ecf8427e"
        name:
          type: string
          minLength: 1
          description: Название угрозы (после trim не может быть пустым)
          example: "Trojan.Win32.Generic"
        severity:
          type: string
          enum: [low, medium, high, critical]
          default: medium
          description: Уровень критичности. Если не передан — medium
          example: "high"
        description:
          type: string
          description: Описание угрозы
          example: "Generic trojan behavior detected"
        category:
          type: string
          default: other
          description: Категория угрозы. Если не передана — other
          example: "trojan"

    ThreatUpdateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          description: Название угрозы (после trim не может быть пустым)
          example: "Trojan.Win32.Generic"
        severity:
          type: string
          enum: [low, medium, high, critical]
          description: Если поле отсутствует — значение не меняется. Пустая строка → medium
          example: "high"
        description:
          type: string
          description: Если поле отсутствует — значение не меняется
          example: "Generic trojan behavior detected"
        category:
          type: string
          description: Если поле отсутствует — значение не меняется. Пустая строка → other
          example: "trojan"

    ThreatResponse:
      type: object
      properties:
        md5:
          type: string
          pattern: '^[a-fA-F0-9]{32}$'
          description: MD5-хеш
          example: "d41d8cd98f00b204e9800998ecf8427e"
        name:
          type: string
          description: Название угрозы
          example: "Trojan.Win32.Generic"
        severity:
          type: string
          enum: [low, medium, high, critical]
          description: Уровень критичности угрозы
          example: "high"
        description:
          type: string
          description: Описание угрозы
          example: "Generic trojan behavior detected"
        category:
          type: string
          description: Категория угрозы
          example: "trojan"
        created_at:
          type: string
          format: date-time
          description: Время создания записи
        updated_at:
          type: string
          format: date-time
          description: Время последнего обновления

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Человекочитаемое описание ошибки
          example: "Threat not found"
        details:
          type: string
          description: Дополнительная информация
          example: "No threat with MD5 d41d8cd98f00b204e9800998ecf8427e found"
